<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard – CareerAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    button {
      padding: 10px 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>CareerAI Dashboard</h1>
</header>

<div class="container">
  <div class="card">
    <h2>Welcome 👋</h2>
    <p>This is your CareerAI dashboard.</p>
  </div>

  <div class="card">
    <h3>Quick Actions</h3>
    <button>Create Resume</button>
    <button>Create Cover Letter</button>
    <button>Build Portfolio</button>
  </div>
</div>

</body>
</html>
