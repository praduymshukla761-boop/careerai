<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CareerAI – Resume Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 20px;
}
h1 { text-align:center; }

.container {
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 14px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.download {
  background: #0d9488;
  margin-top: 10px;
}

/* Resume styles */
.resume { font-size:14px; color:#334155; }
.classic h2 { color:#1e293b; }
.modern h2 { color:#2563eb; }
.executive h2 { color:#7c2d12; }

.executive {
  border-left: 6px solid #7c2d12;
  padding-left: 15px;
}

@media(max-width:900px){
  .container { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<h1>CareerAI – Resume Builder</h1>

<div class="container">

<!-- FORM -->
<div class="box">
  <h2>Fill Your Details</h2>

  <select id="template">
    <option value="classic">Classic (Free)</option>
    <option value="modern">Modern (Free)</option>
    <option value="executive">Executive (Pro)</option>
  </select>

  <input id="name" placeholder="Full Name">
  <input id="role" placeholder="Job Title">
  <input id="contact" placeholder="Email | Phone | Location">

  <textarea id="summary" placeholder="Professional Summary"></textarea>
  <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
  <textarea id="experience" placeholder="Experience (one per line)"></textarea>
  <textarea id="education" placeholder="Education"></textarea>

  <button onclick="generate()">Generate Resume</button>
</div>

<!-- PREVIEW -->
<div class="box resume classic" id="resume">
  <h2 id="rname">Your Name</h2>
  <p id="rcontact"></p>

  <h3>Summary</h3>
  <p id="rsummary"></p>

  <h3>Skills</h3>
  <ul id="rskills"></ul>

  <h3>Experience</h3>
  <ul id="rexperience"></ul>

  <h3>Education</h3>
  <p id="reducation"></p>

  <button class="download" onclick="window.print()">Download PDF</button>
</div>

</div>

<script>
function generate() {
  const template = document.getElementById("template").value;

  // Pro lock (simple)
  if (template === "executive" && localStorage.getItem("careerai_pro") !== "true") {
    alert("Executive template is Pro. Upgrade required.");
    return;
  }

  const resume = document.getElementById("resume");
  resume.className = "box resume " + template;

  document.getElementById("rname").innerText =
    document.getElementById("name").value + " – " +
    document.getElementById("role").value;

  document.getElementById("rcontact").innerText =
    document.getElementById("contact").value;

  document.getElementById("rsummary").innerText =
    document.getElementById("summary").value;

  document.getElementById("reducation").innerText =
    document.getElementById("education").value;

  // Skills
  const skills = document.getElementById("skills").value.split(",");
  const sList = document.getElementById("rskills");
  sList.innerHTML = "";
  skills.forEach(s => {
    if (s.trim()) {
      const li = document.createElement("li");
      li.innerText = s.trim();
      sList.appendChild(li);
    }
  });

  // Experience
  const exp = document.getElementById("experience").value.split("\n");
  const eList = document.getElementById("rexperience");
  eList.innerHTML = "";
  exp.forEach(e => {
    if (e.trim()) {
      const li = document.createElement("li");
      li.innerText = e.trim();
      eList.appendChild(li);
    }
  });
}
</script>

</body>
</html>
