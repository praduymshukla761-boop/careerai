<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CareerAI – Resume Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 20px;
}
h1 {
  text-align: center;
  color: #1e293b;
}
.container {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}
.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  flex: 1;
  min-width: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
}
button {
  padding: 12px;
  width: 100%;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button.pro {
  background: #f97316;
}
.resume {
  border-left: 5px solid #2563eb;
}
.executive {
  border-left-color: #f97316;
}
.download {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>CareerAI – Smart Resume Builder</h1>

<div class="container">

<!-- FORM -->
<div class="box">
  <h2>Fill Your Details</h2>

  <select id="template">
    <option value="classic">Classic (Free)</option>
    <option value="modern">Modern (Free)</option>
    <option value="executive">Executive (Pro)</option>
  </select>

  <input id="name" placeholder="Full Name">
  <input id="contact" placeholder="Email | Phone | Location">
  <input id="role" placeholder="Job Title">

  <textarea id="summary" placeholder="Professional Summary"></textarea>
  <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
  <textarea id="experience" placeholder="Experience (one point per line)"></textarea>
  <textarea id="education" placeholder="Education"></textarea>

  <button onclick="generateResume()">Generate Resume</button>
</div>

<!-- PREVIEW -->
<div class="box resume classic" id="resume">
  <h2 id="rname">Your Name</h2>
  <p id="rcontact"></p>
  <h3>Summary</h3>
  <p id="rsummary"></p>
  <h3>Skills</h3>
  <ul id="rskills"></ul>
  <h3>Experience</h3>
  <ul id="rexperience"></ul>
  <h3>Education</h3>
  <p id="reducation"></p>

  <button class="download" onclick="window.print()">Download PDF</button>
</div>

</div>

<script>
function generateResume() {
  const template = document.getElementById("template").value;
  const isPro = localStorage.getItem("careerai_pro");

  if (template === "executive" && isPro !== "true") {
    alert("🔒 Executive template is Pro only.");
    window.location.href = "payment.html";
    return;
  }

  document.getElementById("resume").className = "box resume " + template;

  rname.innerText = name.value;
  rcontact.innerText = contact.value;
  rsummary.innerText = summary.value;
  reducation.innerText = education.value;

  rskills.innerHTML = "";
  skills.value.split(",").forEach(s => {
    let li = document.createElement("li");
    li.innerText = s.trim();
    rskills.appendChild(li);
  });

  rexperience.innerHTML = "";
  experience.value.split("\n").forEach(e => {
    let li = document.createElement("li");
    li.innerText = e;
    rexperience.appendChild(li);
  });
}
</script>

</body>
</html>
