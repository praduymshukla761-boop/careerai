<!DOCTYPE html>
<html>
<head>
<title>Sign Up – CareerAI</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:30px;
  border-radius:10px;
  width:320px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
}
</style>
</head>
<body>

<div class="box">
  <h2>Create your account</h2>

  <!-- GOOGLE FORM CONNECTION -->
  <form 
    action="PASTE_GOOGLE_FORM_ACTION_URL_HERE"
    method="POST"
    target="hidden_iframe"
    onsubmit="afterSubmit()"
  >
    <input 
      type="email" 
      name="entry.XXXXXXXXX" 
      placeholder="Enter your email" 
      required
    >

    <button type="submit">Continue</button>
  </form>

  <iframe name="hidden_iframe" style="display:none;"></iframe>
</div>

<script>
function afterSubmit(){
  localStorage.setItem("careerai_loggedin","true");
  setTimeout(()=>{
    window.location.href="resume.html";
  }, 500);
}
</script>

</body>
</html>
