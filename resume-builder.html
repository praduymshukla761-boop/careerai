      <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareerAI – Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1e293b;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .resume h2 {
      margin-bottom: 5px;
      color: #1e293b;
    }

    .resume p, .resume li {
      font-size: 14px;
      color: #334155;
    }

    ul {
      padding-left: 18px;
    }

    .download {
      margin-top: 15px;
      background: #0d9488;
    }

    @media(max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<h1>CareerAI – One-Click Resume Builder</h1>

<div class="container">

  <!-- FORM -->
  <div class="box">
    <h2>Fill Your Details</h2>

    <input id="fname" placeholder="First Name">
    <input id="lname" placeholder="Last Name">
    <input id="phone" placeholder="Phone Number">
    <input id="role" placeholder="Job Title">

    <textarea id="summary" placeholder="Professional Summary"></textarea>
    <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
    <textarea id="experience" placeholder="Experience (bullet points)"></textarea>
    <textarea id="education" placeholder="Education"></textarea>

    <button onclick="generate()">Generate Resume</button>
  </div>

  <!-- RESUME PREVIEW -->
  <div class="box resume" id="resume">
    <h2 id="rname">Your Name</h2>
    <p id="rcontact"></p>

    <h3>Summary</h3>
    <p id="rsummary"></p>

    <h3>Skills</h3>
    <ul id="rskills"></ul>

    <h3>Experience</h3>
    <ul id="rexperience"></ul>

    <h3>Education</h3>
    <p id="reducation"></p>

    <button class="download" onclick="window.print()">Download Resume (PDF)</button>
  </div>

</div>

<script>
function generate() {
  const fname = document.getElementById("fname").value;
  const lname = document.getElementById("lname").value;
  const phone = document.getElementById("phone").value;
  const role = document.getElementById("role").value;
  const summary = document.getElementById("summary").value;
  const skills = document.getElementById("skills").value.split(",");
  const experience = document.getElementById("experience").value.split("\n");
  const education = document.getElementById("education").value;

  document.getElementById("rname").innerText = fname + " " + lname + " – " + role;
  document.getElementById("rcontact").innerText = phone;
  document.getElementById("rsummary").innerText = summary;
  document.getElementById("reducation").innerText = education;

  const skillList = document.getElementById("rskills");
  skillList.innerHTML = "";
  skills.forEach(s => {
    if (s.trim()) {
      const li = document.createElement("li");
      li.innerText = s.trim();
      skillList.appendChild(li);
    }
  });

  const expList = document.getElementById("rexperience");
  expList.innerHTML = "";
  experience.forEach(e => {
    if (e.trim()) {
      const li = document.createElement("li");
      li.innerText = e.trim();
      expList.appendChild(li);
    }
  });
}
</script>

</body>
</html>
