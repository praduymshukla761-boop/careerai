<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Builder – CareerAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      gap: 20px;
    }

    .form-box, .preview-box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      flex: 1;
      min-width: 300px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #1e293b;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .pro {
      background: #16a34a;
    }

    .resume {
      font-size: 14px;
      color: #0f172a;
    }

    .resume h3 {
      margin-bottom: 5px;
    }

    .resume p {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .note {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>CareerAI Resume Builder</h1>
</header>

<div class="container">

  <!-- FORM -->
  <div class="form-box">
    <h2>Enter Your Details</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="title" placeholder="Job Title (e.g. Software Engineer)">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone">
    <input type="text" id="location" placeholder="Location">

    <textarea id="summary" placeholder="Professional Summary"></textarea>
    <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
    <textarea id="experience" placeholder="Work Experience"></textarea>
    <textarea id="education" placeholder="Education"></textarea>

    <button onclick="generateResume()">Generate Resume</button>

    <button class="pro" onclick="downloadResume()">Generate & Download (Pro)</button>

    <p class="note">
      ⚠ Free users can preview only.  
      Download is available for Pro users.
    </p>
  </div>

  <!-- PREVIEW -->
  <div class="preview-box">
    <h2>Resume Preview</h2>

    <div class="resume" id="resumePreview">
      <p>Fill the form to see your resume preview here.</p>
    </div>
  </div>

</div>

<script>
  function generateResume() {
    const name = document.getElementById("name").value;
    const title = document.getElementById("title").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const location = document.getElementById("location").value;
    const summary = document.getElementById("summary").value;
    const skills = document.getElementById("skills").value;
    const experience = document.getElementById("experience").value;
    const education = document.getElementById("education").value;

    document.getElementById("resumePreview").innerHTML = `
      <h2>${name}</h2>
      <p><strong>${title}</strong></p>
      <p>${email} | ${phone} | ${location}</p>

      <h3>Summary</h3>
      <p>${summary}</p>

      <h3>Skills</h3>
      <p>${skills}</p>

      <h3>Experience</h3>
      <p>${experience}</p>

      <h3>Education</h3>
      <p>${education}</p>
    `;
  }

  function downloadResume() {
    const isPro = localStorage.getItem("careerai_pro");

    if (isPro === "true") {
      alert("✅ Pro access confirmed. Resume download will be available in next version.");
    } else {
      alert("❌ Upgrade to Pro to download your resume.");
      window.location.href = "payment.html";
    }
  }
</script>

</body>
</html>
