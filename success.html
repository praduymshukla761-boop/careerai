<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Successful – CareerAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .box {
      background: rgba(255,255,255,0.15);
      padding: 50px 40px;
      border-radius: 14px;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    p {
      font-size: 17px;
      opacity: 0.95;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: white;
      color: #166534;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      border-radius: 8px;
    }

    .btn:hover {
      background: #dcfce7;
    }

    .small {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎉 Payment Successful!</h1>
    <p>
      Welcome to <strong>CareerAI Pro</strong> 🚀<br>
      Your premium features are now unlocked.
    </p>

    <a href="dashboard.html" class="btn">Go to Dashboard</a>

    <div class="small">
      Redirecting automatically in 5 seconds…
    </div>
  </div>

  <!-- 🔐 PRO UNLOCK LOGIC -->
  <script>
    // Mark user as PRO
    localStorage.setItem("isPro", "true");

    // Auto redirect after 5 seconds
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 5000);
  </script>

</body>
</html>
