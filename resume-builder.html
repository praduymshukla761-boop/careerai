<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CareerAI – Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 30px;
    }

    .box {
      max-width: 700px;
      background: white;
      margin: auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Fill Your Resume</h2>

    <input type="text" placeholder="Full Name" />
    <input type="text" placeholder="Job Title" />
    <input type="text" placeholder="Email / Phone" />

    <textarea rows="4" placeholder="Professional Summary"></textarea>
    <textarea rows="4" placeholder="Skills (comma separated)"></textarea>
    <textarea rows="5" placeholder="Experience"></textarea>
    <textarea rows="3" placeholder="Education"></textarea>

    <button>Generate Resume</button>

    <a href="index.html" class="back">← Back to Home</a>
  </div>
</body>
</html>
