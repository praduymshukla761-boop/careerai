<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CareerAI – Resume Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
}
h1{
  text-align:center;
  padding:20px;
}
.container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}
.box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  flex:1;
  min-width:300px;
}
input, textarea, select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}
.ai{
  background:#7c3aed;
  color:white;
}
.generate{
  background:#2563eb;
  color:white;
}
.pro{
  background:#f97316;
  color:white;
}
.download{
  background:#16a34a;
  color:white;
}
.resume h2{
  margin-bottom:5px;
}
.resume h3{
  margin-top:15px;
}
.resume ul{
  padding-left:20px;
}
.hidden{
  display:none;
}
</style>
</head>

<body>

<h1>CareerAI – Resume Builder</h1>

<div class="container">

<!-- LEFT: FORM -->
<div class="box">
<h2>Fill Your Details</h2>

<select id="template">
  <option value="classic">Classic (Free)</option>
  <option value="modern">Modern (Free)</option>
  <option value="executive">Executive (Pro)</option>
</select>

<input id="name" placeholder="Full Name">
<input id="role" placeholder="Job Title">
<input id="contact" placeholder="Email | Phone | Location">

<textarea id="summary" placeholder="Professional Summary"></textarea>
<textarea id="skills" placeholder="Skills (comma separated)"></textarea>
<textarea id="experience" placeholder="Experience (one point per line)"></textarea>
<textarea id="education" placeholder="Education"></textarea>

<button class="ai" onclick="aiGenerate()">✨ Generate with AI</button>
<button class="generate" onclick="generateResume()">Generate Resume</button>
<button class="pro" onclick="upgradePro()">Upgrade to Pro</button>

</div>

<!-- RIGHT: PREVIEW -->
<div class="box resume" id="resumeBox">
<h2 id="rname">Your Name</h2>
<p id="rcontact"></p>

<h3>Summary</h3>
<p id="rsummary"></p>

<h3>Skills</h3>
<ul id="rskills"></ul>

<h3>Experience</h3>
<ul id="rexperience"></ul>

<h3>Education</h3>
<p id="reducation"></p>

<button class="download" onclick="window.print()">Download Resume</button>
</div>

</div>

<script>
function aiGenerate(){
  const role = document.getElementById("role").value || "Professional";

  document.getElementById("summary").value =
    role + " with strong problem-solving abilities, proven performance, and a results-driven mindset. Experienced in teamwork, communication, and delivering measurable impact.";

  document.getElementById("skills").value =
    "Communication, Leadership, Problem Solving, Teamwork, Time Management, Adaptability";

  document.getElementById("experience").value =
    "Worked as a " + role + " handling key responsibilities\n" +
    "Collaborated with cross-functional teams\n" +
    "Improved efficiency and productivity\n" +
    "Adapted quickly to new tools and challenges";
}

function generateResume(){
  document.getElementById("rname").innerText =
    document.getElementById("name").value || "Your Name";

  document.getElementById("rcontact").innerText =
    document.getElementById("contact").value;

  document.getElementById("rsummary").innerText =
    document.getElementById("summary").value;

  // Skills
  const skillsList = document.getElementById("skills").value.split(",");
  const rskills = document.getElementById("rskills");
  rskills.innerHTML="";
  skillsList.forEach(skill=>{
    if(skill.trim()){
      const li=document.createElement("li");
      li.innerText=skill.trim();
      rskills.appendChild(li);
    }
  });

  // Experience
  const expList = document.getElementById("experience").value.split("\n");
  const rexp = document.getElementById("rexperience");
  rexp.innerHTML="";
  expList.forEach(exp=>{
    if(exp.trim()){
      const li=document.createElement("li");
      li.innerText=exp.trim();
      rexp.appendChild(li);
    }
  });

  document.getElementById("reducation").innerText =
    document.getElementById("education").value;
}

function upgradePro(){
  window.location.href = "payment.html";
}
</script>

</body>
</html>
