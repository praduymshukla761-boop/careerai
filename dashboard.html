<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareerAI Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    button {
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    .pro-box {
      border: 2px dashed #2563eb;
      text-align: center;
    }

    .success {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>CareerAI Dashboard</h1>
</header>

<div class="container">

  <div class="card">
    <h2>Welcome 👋</h2>
    <p>Build your resume, cover letter & portfolio.</p>
  </div>

  <div class="card">
    <h3>Quick Actions</h3>

    <a href="resume-builder.html">
      <button>Create Resume</button>
    </a>
  </div>

  <!-- PRO SECTION -->
  <div class="card pro-box">
    <h3>CareerAI Pro 🚀</h3>

    <p id="proMessage">
      Unlock premium templates, AI improvements & PDF download.
    </p>

    <a href="https://buy.stripe.com/test_bJe7sEbdA6wL9C1bf600000" id="upgradeBtn">
      <button>Upgrade to Pro (£2.99)</button>
    </a>

    <p id="proBadge" class="success" style="display:none;">
      ✅ You are a Pro user
    </p>
  </div>

</div>

<script>
  const isPro = localStorage.getItem("careerai_pro");

  if (isPro === "true") {
    document.getElementById("upgradeBtn").style.display = "none";
    document.getElementById("proMessage").innerText =
      "All premium features are unlocked.";
    document.getElementById("proBadge").style.display = "block";
  }
</script>

</body>
</html>
