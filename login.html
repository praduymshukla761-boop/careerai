<!DOCTYPE html>
<html>
<head>
<title>Login – CareerAI</title>
<style>
body{
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:30px;
  border-radius:10px;
  width:320px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
}
button{
  background:#16a34a;
  color:white;
  border:none;
  border-radius:6px;
}
a{font-size:14px;}
</style>
</head>

<body>

<div class="box">
  <h2>Login to CareerAI</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p>New user? <a href="signup.html">Sign up</a></p>
</div>

<script>
function login(){
  const savedEmail = localStorage.getItem("careerai_email");
  const savedPassword = localStorage.getItem("careerai_password");

  if(
    email.value === savedEmail &&
    password.value === savedPassword
  ){
    localStorage.setItem("careerai_loggedin","true");
    window.location.href="resume.html";
  }else{
    alert("Wrong email or password");
  }
}
</script>

</body>
</html>
