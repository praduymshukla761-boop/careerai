<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – CareerAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your CareerAI account">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #1e293b;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    p {
      font-size: 14px;
      color: #64748b;
    }
    a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>CareerAI</h1>
  <p>Login to your account</p>

  <input type="email" placeholder="Email Address">
  <input type="password" placeholder="Password">

  <button>Login</button>

  <p>Don’t have an account? <a href="signup.html">Sign up</a></p>
</div>

</body>
</html>
